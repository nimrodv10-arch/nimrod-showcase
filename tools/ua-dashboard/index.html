<style>@import url("https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=Unbounded:wght@500;600;700&display=swap");

/* Nimrod — component styles. Every value comes from tokens.css. RTL-first: logical properties only. */
html { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 26px; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: var(--space-5); }
.nd-num, .nd-num * { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; }
.nd-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.nd-stack { display: flex; flex-direction: column; gap: var(--space-4); }
.nd-muted { color: var(--ink-muted); }
:where(button, a, input, select, [tabindex]):focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* Button */
.nd-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: 36px; padding-inline: var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; font: 500 14px/20px var(--font-sans); cursor: pointer; transition: transform 100ms ease-out, background-color 120ms ease-out; }
.nd-btn:active { transform: scale(0.97); }
.nd-btn svg { width: 16px; height: 16px; flex: none; }
.nd-btn--primary { background: var(--accent); color: var(--on-accent); }
.nd-btn--primary:hover { background: var(--accent-hover); }
.nd-btn--secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.nd-btn--secondary:hover { background: var(--surface-hover); }
.nd-btn--ghost { background: transparent; color: var(--ink); }
.nd-btn--ghost:hover { background: var(--surface-hover); }
.nd-btn--danger { background: var(--danger-solid); color: var(--on-accent); }
.nd-btn--sm { height: 28px; padding-inline: var(--space-3); font-size: 13px; }
.nd-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

/* Segmented control */
.nd-seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--surface-sunken); border-radius: var(--radius-md); }
.nd-seg button { display: inline-flex; align-items: center; gap: var(--space-1); height: 28px; padding-inline: var(--space-3); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-muted); font: 500 13px/18px var(--font-sans); cursor: pointer; }
.nd-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-md); }
.nd-seg button svg { width: 14px; height: 14px; }

/* Status pill: dot + word, never colour alone */
.nd-pill { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding-inline: var(--space-2); border-radius: var(--radius-sm); font: 500 12px/16px var(--font-sans); background: var(--surface-sunken); color: var(--ink-muted); }
.nd-pill::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; }
.nd-pill--positive { background: var(--positive-subtle); color: var(--positive-text); }
.nd-pill--warning { background: var(--warning-subtle); color: var(--warning-text); }
.nd-pill--danger { background: var(--danger-subtle); color: var(--danger-text); }
.nd-pill--info { background: var(--accent-subtle); color: var(--accent-text); }

/* Card */
.nd-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-5); }
.nd-card__title { margin: 0; font: 600 14px/24px var(--font-sans); }
.nd-card__meta { margin: 0; color: var(--ink-muted); font-size: 13px; line-height: 18px; }
.nd-card--interactive { cursor: pointer; transition: box-shadow 160ms ease-out; }
.nd-card--interactive:hover { box-shadow: var(--shadow-md); }

/* KPI card */
.nd-kpi { display: flex; flex-direction: column; gap: var(--space-2); min-inline-size: 180px; }
.nd-kpi__label { color: var(--ink-muted); font: 500 12px/16px var(--font-sans); letter-spacing: .01em; }
.nd-kpi__value { font: 600 32px/40px var(--font-numeric); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.nd-kpi__delta { display: inline-flex; align-items: center; gap: var(--space-1); font: 500 13px/18px var(--font-numeric); font-variant-numeric: tabular-nums; }
.nd-kpi__delta--good { color: var(--positive-text); }
.nd-kpi__delta--bad { color: var(--danger-text); }
.nd-kpi__delta span { color: var(--ink-muted); font-family: var(--font-sans); }
.nd-kpi__delta { white-space: nowrap; }
.nd-kpi__delta svg { width: 14px; height: 14px; flex: none; }

/* Pacing bar */
.nd-pace { display: flex; flex-direction: column; gap: var(--space-2); }

/* Field */

.nd-input { height: 36px; padding-inline: var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: 400 16px/24px var(--font-sans); }
.nd-input::placeholder { color: var(--ink-muted); }
.nd-field__help { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

.nd-field--error .nd-field__help { color: var(--danger-text); }

/* Table */
.nd-table { inline-size: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; font-size: 14px; line-height: 20px; }
.nd-table th { text-align: start; padding: var(--space-3) var(--space-4); color: var(--ink-muted); font: 500 12px/16px var(--font-sans); border-block-end: 1px solid var(--border); }
.nd-table td { padding: var(--space-3) var(--space-4); border-block-end: 1px solid var(--border); }
.nd-table tbody tr:hover td { background: var(--surface-hover); }
.nd-table .is-num { text-align: end; font-family: var(--font-numeric); font-variant-numeric: tabular-nums; }
.nd-table tfoot td { background: var(--surface-sunken); font-weight: 600; border-block-end: 0; }
.nd-micro { display: inline-block; vertical-align: middle; inline-size: 56px; height: 4px; margin-inline-start: var(--space-2); border-radius: var(--radius-full); background: var(--surface-sunken); overflow: hidden; }

/* Drawer (slide-over from the inline-start edge in RTL = right side) */
.nd-drawer-host { position: relative; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--canvas); }
.nd-scrim { position: absolute; inset: 0; background: var(--scrim); }
.nd-drawer { position: absolute; inset-block: 0; inset-inline-start: 0; inline-size: min(380px, 85%); background: var(--surface); box-shadow: var(--shadow-lg); border-start-end-radius: var(--radius-xl); border-end-end-radius: var(--radius-xl); display: flex; flex-direction: column; }
.nd-drawer__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-5) var(--space-6); border-block-end: 1px solid var(--border); }
.nd-drawer__body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); overflow: auto; }
.nd-check { display: flex; align-items: center; gap: var(--space-2); }
.nd-check input { inline-size: 16px; block-size: 16px; accent-color: var(--accent); margin: 0; }

/* Translucent top bar */
.nd-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) var(--space-5); background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }


/* Kanban board */
.nd-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: var(--space-4); overflow-x: auto; }
.nd-col { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-lg); min-block-size: 120px; }
.nd-col__head { display: flex; align-items: center; justify-content: space-between; padding-inline: var(--space-1); padding-block-end: var(--space-1); font: 600 13px/18px var(--font-sans); }
.nd-col__count { font: 500 12px/16px var(--font-numeric); font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.nd-col .nd-card { padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); }
.nd-col__empty { padding: var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); color: var(--ink-muted); font-size: 13px; line-height: 18px; text-align: center; }

/* Budget hero — "safe to spend" */
.nd-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.nd-hero__label { color: var(--ink-muted); font: 500 13px/18px var(--font-sans); }
.nd-hero__value { font: 600 44px/52px var(--font-numeric); letter-spacing: -0.025em; font-variant-numeric: tabular-nums; color: var(--ink); }
.nd-hero__sub { color: var(--ink-muted); font-size: 14px; line-height: 20px; }
.nd-hero__sub b { color: var(--ink); font-weight: 600; font-family: var(--font-numeric); font-variant-numeric: tabular-nums; }
.nd-hero__track { position: relative; height: 10px; border-radius: var(--radius-full); background: var(--surface-sunken); }
.nd-hero__fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: var(--radius-full); background: var(--positive); }
.nd-hero--warning .nd-hero__fill { background: var(--warning); }
.nd-hero--danger .nd-hero__fill { background: var(--danger); }
.nd-hero__today { position: absolute; inset-block: -4px; inline-size: 2px; background: var(--ink); border-radius: var(--radius-full); }
.nd-hero__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); padding-block-start: var(--space-4); border-block-start: 1px solid var(--border); }
.nd-hero__stats dt { color: var(--ink-muted); font: 500 12px/16px var(--font-sans); }
.nd-hero__stats dd { margin: 0; font: 600 20px/28px var(--font-numeric); font-variant-numeric: tabular-nums; }

/* Insight strip — icon tile + text + action; no side stripe */
.nd-insight { display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-4) var(--space-5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.nd-insight__icon { flex: none; display: grid; place-items: center; inline-size: 32px; block-size: 32px; border-radius: var(--radius-md); background: var(--accent-subtle); color: var(--accent-text); }

.nd-insight--warning .nd-insight__icon { background: var(--warning-subtle); color: var(--warning-text); }
.nd-insight--danger .nd-insight__icon { background: var(--danger-subtle); color: var(--danger-text); }
.nd-insight--positive .nd-insight__icon { background: var(--positive-subtle); color: var(--positive-text); }
.nd-insight__body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nd-insight__kicker { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.nd-insight__title { margin: 0; font: 600 14px/24px var(--font-sans); }
.nd-insight__text { margin: 0; color: var(--ink-muted); font-size: 14px; line-height: 20px; }
.nd-insight__text b { color: var(--ink); font-family: var(--font-numeric); font-variant-numeric: tabular-nums; font-weight: 600; }

/* Toast — inverted surface, one action, auto-dismiss */
.nd-toast { display: inline-flex; align-items: center; gap: var(--space-3); min-block-size: 44px; padding-block: var(--space-2); padding-inline: var(--space-4) var(--space-2); background: var(--ink); color: var(--canvas); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); font: 500 14px/20px var(--font-sans); max-inline-size: 420px; }
.nd-toast svg { width: 16px; height: 16px; flex: none; }
.nd-toast__action { margin-inline-start: auto; height: 28px; padding-inline: var(--space-3); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--canvas); font: 600 13px/18px var(--font-sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.nd-toast__action:hover { background: color-mix(in srgb, var(--canvas) 14%, transparent); }
.nd-toast__action:focus-visible { outline-color: var(--canvas); }
.nd-toast-region { position: fixed; inset-block-end: var(--space-6); inset-inline: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); pointer-events: none; }
.nd-toast-region > * { pointer-events: auto; }


/* Document (notebook) typography */
.nd-doc { max-inline-size: 720px; font: 400 16px/26px var(--font-sans); color: var(--ink); }
.nd-doc h1 { margin: 0 0 var(--space-2); font: 700 44px/52px var(--font-serif); letter-spacing: -0.01em; }
.nd-doc h2 { margin: var(--space-8) 0 var(--space-2); font: 700 28px/36px var(--font-serif); }
.nd-doc h3 { margin: var(--space-6) 0 var(--space-1); font: 500 20px/30px var(--font-serif); }
.nd-doc p { margin: 0 0 var(--space-3); }
.nd-doc__meta { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; color: var(--ink-muted); font-size: 13px; line-height: 20px; margin-block-end: var(--space-6); }

/* Sidebar with page tree */
.nd-side { display: flex; flex-direction: column; gap: 2px; inline-size: 248px; padding: var(--space-3) var(--space-2); background: var(--surface-sunken); border-inline-end: 1px solid var(--border); font-size: 14px; line-height: 20px; }
.nd-side__ws { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); margin-block-end: var(--space-2); font-weight: 600; }
.nd-side__ws i { display: grid; place-items: center; inline-size: 22px; block-size: 22px; border-radius: var(--radius-sm); background: var(--ink); color: var(--canvas); font: 700 12px/1 var(--font-sans); font-style: normal; }
.nd-side__label { padding: var(--space-3) var(--space-2) var(--space-1); color: var(--ink-muted); font: 500 12px/16px var(--font-sans); }
.nd-side a, .nd-side summary { display: flex; align-items: center; gap: var(--space-2); min-block-size: 30px; padding-inline: var(--space-2); border-radius: var(--radius-sm); color: var(--ink-muted); text-decoration: none; cursor: pointer; list-style: none; }
.nd-side summary::-webkit-details-marker { display: none; }
.nd-side a:hover, .nd-side summary:hover { background: var(--surface-hover); color: var(--ink); }
.nd-side a[aria-current="page"] { background: var(--surface-hover); color: var(--ink); font-weight: 500; }
.nd-side svg { inline-size: 16px; block-size: 16px; flex: none; }
.nd-side details > div { padding-inline-start: var(--space-5); display: flex; flex-direction: column; gap: 2px; }
.nd-side .nd-chev { transition: transform 160ms ease-out; transform: scaleX(-1); }

/* Tags & tag select */
.nd-tag { display: inline-flex; align-items: center; gap: var(--space-1); block-size: 22px; padding-inline: var(--space-2); border-radius: var(--radius-sm); font: 500 13px/18px var(--font-sans); white-space: nowrap; background: var(--tag-gray-bg); color: var(--tag-gray-text); }
.nd-tag button { display: grid; place-items: center; inline-size: 16px; block-size: 16px; margin-inline-end: -4px; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: inherit; cursor: pointer; }
.nd-tag button:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.nd-tag button svg { inline-size: 12px; block-size: 12px; }
.nd-tag--brown { background: var(--tag-brown-bg); color: var(--tag-brown-text); }
.nd-tag--orange { background: var(--tag-orange-bg); color: var(--tag-orange-text); }
.nd-tag--yellow { background: var(--tag-yellow-bg); color: var(--tag-yellow-text); }
.nd-tag--green { background: var(--tag-green-bg); color: var(--tag-green-text); }
.nd-tag--blue { background: var(--tag-blue-bg); color: var(--tag-blue-text); }
.nd-tag--purple { background: var(--tag-purple-bg); color: var(--tag-purple-text); }
.nd-tag--pink { background: var(--tag-pink-bg); color: var(--tag-pink-text); }
.nd-tag--red { background: var(--tag-red-bg); color: var(--tag-red-text); }
.nd-tagselect { inline-size: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; font-size: 14px; }
.nd-tagselect__field { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; padding: var(--space-2); background: var(--surface-sunken); border-block-end: 1px solid var(--border); }
.nd-tagselect__field input { flex: 1; min-inline-size: 80px; border: 0; background: transparent; color: var(--ink); font: 400 14px/20px var(--font-sans); outline: none; }
.nd-tagselect__hint { padding: var(--space-2) var(--space-3) var(--space-1); color: var(--ink-muted); font: 500 12px/16px var(--font-sans); }
.nd-tagselect ul { list-style: none; margin: 0; padding: 0 var(--space-1) var(--space-1); }
.nd-tagselect li { display: flex; align-items: center; justify-content: space-between; min-block-size: 32px; padding-inline: var(--space-2); border-radius: var(--radius-sm); cursor: pointer; }
.nd-tagselect li:hover, .nd-tagselect li[aria-selected="true"] { background: var(--surface-hover); }
.nd-tagselect li small { color: var(--ink-muted); font-size: 12px; }

/* Callout */
.nd-callout { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-4); border-radius: var(--radius-md); background: var(--tag-gray-bg); color: var(--ink); }
.nd-callout__icon { flex: none; display: grid; place-items: center; inline-size: 24px; block-size: 24px; color: var(--tag-gray-text); }
.nd-callout__icon svg { inline-size: 18px; block-size: 18px; }
.nd-callout p { margin: 0; }
.nd-callout strong { font-weight: 600; }
.nd-callout--blue { background: var(--tag-blue-bg); } .nd-callout--blue .nd-callout__icon { color: var(--tag-blue-text); }
.nd-callout--yellow { background: var(--tag-yellow-bg); } .nd-callout--yellow .nd-callout__icon { color: var(--tag-yellow-text); }
.nd-callout--green { background: var(--tag-green-bg); } .nd-callout--green .nd-callout__icon { color: var(--tag-green-text); }
.nd-callout--red { background: var(--tag-red-bg); } .nd-callout--red .nd-callout__icon { color: var(--tag-red-text); }

/* Toggle block (details/summary) */
.nd-toggle { border-radius: var(--radius-sm); }
.nd-toggle > summary { display: flex; align-items: center; gap: var(--space-1); min-block-size: 32px; padding-inline: var(--space-1); border-radius: var(--radius-sm); cursor: pointer; list-style: none; font-weight: 500; }
.nd-toggle > summary::-webkit-details-marker { display: none; }
.nd-toggle > summary:hover { background: var(--surface-hover); }
.nd-toggle > summary svg { inline-size: 16px; block-size: 16px; flex: none; color: var(--ink-muted); transform: scaleX(-1); transition: transform 160ms ease-out; }
.nd-toggle[open] > summary svg { transform: rotate(90deg); }
.nd-toggle__body { padding-inline-start: var(--space-6); padding-block: var(--space-1) var(--space-2); color: var(--ink); }
.nd-toggle__body p { margin: 0 0 var(--space-2); }


/* Charts (used by Nimrod.LineChart / Nimrod.BarChart) */
.nd-chart { position: relative; display: flex; flex-direction: column; gap: var(--space-3); }
.nd-chart__head { display: flex; flex-direction: column; gap: 2px; }
.nd-chart__title { font: 600 16px/24px var(--font-sans); color: var(--ink); }

.nd-legend { display: flex; flex-wrap: wrap; gap: var(--space-4); margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 20px; color: var(--ink-muted); }

.nd-legend i { inline-size: 12px; block-size: 3px; border-radius: var(--radius-full); }
.nd-chart__plot { position: relative; }

.nd-chart__tick { fill: var(--ink-muted); font: 500 12px var(--font-numeric); font-variant-numeric: tabular-nums; }
.nd-chart__label { fill: var(--ink); font: 400 13px var(--font-sans); }
.nd-chart__end { fill: var(--ink); font: 600 12px var(--font-numeric); font-variant-numeric: tabular-nums; }
.nd-chart__line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nd-chart__area { opacity: .1; }
.nd-chart__dot { stroke: var(--surface); stroke-width: 2; }
.nd-chart__bar { outline: none; }
.nd-chart__bar:focus-visible { stroke: var(--focus-ring); stroke-width: 2; }
.nd-chart__ref { stroke: var(--chart-ref); stroke-width: 1; stroke-dasharray: 4 4; }
.nd-chart__reflabel { fill: var(--chart-ref); font: 500 12px var(--font-sans); }
.nd-chart__cross { stroke: var(--border-strong); stroke-width: 1; }
.nd-chart svg rect:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.nd-tooltip { position: absolute; z-index: 2; min-inline-size: 140px; padding: var(--space-2) var(--space-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); font-size: 13px; line-height: 20px; pointer-events: none; }
.nd-tooltip__label { color: var(--ink-muted); font-size: 12px; margin-block-end: 2px; }
.nd-tooltip__row { display: flex; align-items: center; gap: var(--space-2); }
.nd-tooltip__row i { inline-size: 12px; block-size: 3px; border-radius: var(--radius-full); flex: none; }
.nd-tooltip__row b { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.nd-tooltip__row span { color: var(--ink-muted); }
.nd-chart__table > summary { font-size: 13px; color: var(--ink-muted); font-weight: 500; }

/* App shell: sidebar + translucent top bar + content; bottom tab bar on phones */
.nd-app { display: grid; grid-template-columns: auto 1fr; min-block-size: 100vh; background: var(--canvas); }
.nd-app > .nd-side { position: sticky; inset-block-start: 0; block-size: 100vh; overflow: auto; }
.nd-app__main { display: flex; flex-direction: column; min-inline-size: 0; }
.nd-app__bar { position: sticky; inset-block-start: 0; z-index: 5; display: flex; align-items: center; gap: var(--space-3); min-block-size: 52px; padding: var(--space-2) var(--space-6); background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-block-end: 1px solid var(--border); }
.nd-app__crumbs { display: flex; align-items: center; gap: var(--space-1); min-inline-size: 0; color: var(--ink-muted); font-size: 14px; line-height: 20px; }
.nd-app__crumbs b { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nd-app__crumbs svg { inline-size: 14px; block-size: 14px; transform: scaleX(-1); }
.nd-app__actions { display: flex; align-items: center; gap: var(--space-2); margin-inline-start: auto; }
.nd-app__menu { display: none; }
.nd-app__content { flex: 1; inline-size: 100%; max-inline-size: 1120px; margin-inline: auto; padding: var(--space-8) var(--space-6) var(--space-16); box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-8); }
.nd-app__title { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.nd-app__title h1 { margin: 0; font: 700 32px/38px var(--font-sans); letter-spacing: -0.03em; }
.nd-app__title p { margin: var(--space-1) 0 0; color: var(--ink-muted); }
.nd-tabbar { display: none; }
@media (max-width: 767px) {
  .nd-app { grid-template-columns: 1fr; }
  .nd-app > .nd-side { display: none; }
  .nd-app__menu { display: inline-flex; }
  .nd-app__bar { padding-inline: var(--space-4); }
  .nd-app__content { padding: var(--space-5) var(--space-4) calc(72px + var(--space-6)); gap: var(--space-6); }
  .nd-app__title h1 { font-size: 24px; line-height: 32px; }
  .nd-tabbar { position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 5; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: var(--space-1) var(--space-2) calc(var(--space-1) + env(safe-area-inset-bottom)); background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-block-start: 1px solid var(--border); }
  .nd-tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-block-size: 52px; border-radius: var(--radius-md); color: var(--ink-muted); text-decoration: none; font: 500 12px/14px var(--font-sans); }
  .nd-tabbar a svg { inline-size: 22px; block-size: 22px; }
  .nd-tabbar a[aria-current="page"] { color: var(--ink); }
  .nd-tabbar a:active { background: var(--surface-hover); }
}
@media (prefers-reduced-transparency: reduce) { .nd-app__bar, .nd-tabbar { background: var(--surface); backdrop-filter: none; } }


/* React layer: fixed drawer, sortable table, inline tag select */
.nd-layer { position: fixed; inset: 0; z-index: 50; }

.ua-hd{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.ua-hd .ua-top__actions{margin-inline-start:auto;flex-wrap:wrap}
.ua-hd .ua-top h1{font-size:24px;line-height:30px}
[data-skin="lemon"] .ua-hd .ua-top h1{font-size:28px;line-height:34px}
.ua-band--tight{padding-block:14px}
.ua-band--tight + .ua-wrap .ua-main{margin-block-start:0}
#pfSent{margin-block-end:-21px}
.ua-csvbtn{background:#fff;color:#1C2745;border-color:#fff;font-weight:600}
:root:not([data-theme="pro-dark"]) .ua-csvbtn{background:var(--ink);color:#fff;border-color:var(--ink)}
.ua-err:empty{display:none}
.gs--hero .gs-gh{font-size:13px;padding:9px 16px}
.gs--hero .gs-card{padding:20px 22px 14px;gap:6px}
.gs--hero .gs-l{font-size:14px;font-weight:500}
.gs--hero .gs-v{font-size:44px;line-height:52px;font-weight:700;letter-spacing:-.02em}
.gs--hero .pf-d{font-size:14px}
.gs--hero .gs-sp{block-size:40px}
@media (max-width:760px){.gs--hero .gs-card{padding:14px 14px 10px}.gs--hero .gs-v{font-size:32px;line-height:36px}.ua-hd .ua-top h1,[data-skin="lemon"] .ua-hd .ua-top h1{font-size:20px;line-height:26px}}
/* v8.2: highlight + quiet tables + pro-pink skin */
.pf-hlz{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-5);min-inline-size:0}.pf-hlz>*{min-inline-size:0}
.pf-hlz [data-cid]{transition:opacity .15s}
.pf-hl-on [data-cid]:not(.is-hl){opacity:.3}
.pf-table tbody tr[aria-selected="true"] td{background:var(--accent-subtle)}
.pf-opn{inline-size:1%;padding-inline:8px!important}
.pf-opn__b{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);border-radius:6px;font:500 12px/1 var(--font-sans);padding:6px 9px;cursor:pointer}
.pf-opn__b:hover{color:var(--ink);border-color:var(--border-strong)}
.pf-opn__b:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.pf-table th{position:relative}
.pf-sr{position:absolute;inset:0;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pf-selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border-radius:var(--radius-lg);background:var(--accent-subtle);color:var(--ink);font-size:14px}
.pf-selbar>span{margin-inline-end:auto}
.pf-table th,.pf-table td{padding:12px 14px}
.pf-table thead th{color:var(--ink-muted);font:500 12px/16px var(--font-sans);background:transparent}
.pf-table td{font-weight:400}
.pf-table td:first-child>small{display:inline-flex;vertical-align:middle;margin-inline-start:8px;padding:1px 7px;border-radius:5px;background:var(--surface-sunken);color:var(--ink-muted);font-size:12px;line-height:16px}
.pf-table .nd-pill{block-size:20px;font-size:12px;font-weight:500}
.pf-table tbody tr:hover td{background:var(--surface-hover)}
.pf-table tfoot td{background:var(--surface-sunken);font-weight:600}
.pf-table td .pf-d{font-size:12px}
[data-skin="mix"][data-theme="pro"]{--accent:#D6006F;--accent-hover:#B8005F;--accent-text:#B8005F;--accent-subtle:#FFF0F7;--focus-ring:#D6006F;--chart-1:#E6007A}
[data-skin="mix"][data-theme="pro-dark"]{--accent:#FF4DA6;--accent-hover:#FF70B8;--accent-text:#FF85C2;--accent-subtle:#3A1328;--focus-ring:#FF4DA6;--chart-1:#FF4DA6}
/* v8.3: Apple-like filter toolbar + contained hero */
.pf-bar{gap:8px;padding:10px 12px;border-radius:16px;background:var(--material,var(--surface));border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.pfm{position:relative}
.pfm>summary{list-style:none}.pfm>summary::-webkit-details-marker{display:none}
.pfm__s{display:inline-flex;align-items:center;gap:7px;block-size:36px;padding:0 12px 0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:500 14px/1 var(--font-sans);cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:background .12s,border-color .12s;box-sizing:border-box}
.pfm__s:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.pfm__s:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.pfm__s>svg{color:var(--ink-muted);flex:none}
.pfm[open]>.pfm__s{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.pfm__dn{display:inline-flex;color:var(--ink-muted);transition:transform .15s}
.pfm[open] .pfm__dn{transform:rotate(180deg)}
.pfm__m{position:absolute;z-index:40;top:calc(100% + 6px);inset-inline-start:0;min-inline-size:200px;padding:6px;border-radius:14px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:2px}
.pfm__m button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:8px;inline-size:100%;padding:9px 10px;border-radius:9px;font:400 14px/1.2 var(--font-sans);color:var(--ink);cursor:pointer;text-align:start;white-space:nowrap}
.pfm__m button:hover,.pfm__m button:focus-visible{background:var(--surface-hover);outline:none}
.pfm__m button[aria-checked="true"]{font-weight:600;color:var(--accent-text)}
.pfm__ck{inline-size:14px;display:inline-flex}
.pfm__tg{padding-inline-end:10px}
.pfm__sw{position:relative;inline-size:30px;block-size:18px;border-radius:999px;background:var(--border-strong);transition:background .15s;flex:none}
.pfm__sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;inline-size:14px;block-size:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.pfm__tg[aria-checked="true"] .pfm__sw{background:var(--accent)}
.pfm__tg[aria-checked="true"] .pfm__sw::after{inset-inline-start:14px}
.gf>.pfm__s{list-style:none}
.gf-seg{margin-inline-start:auto}
.gs--hero .gs-grp{border:1px solid var(--border-strong);border-radius:18px;box-shadow:var(--shadow-md)}
.gs--hero .gs-gh{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
@media (max-width:640px){.pfm__s{block-size:34px;font-size:13px;padding:0 10px 0 12px}.pfm__tg span{display:none}.pfm__m{min-inline-size:180px}}
@media (prefers-reduced-motion:reduce){.pfm__dn,.pfm__sw,.pfm__sw::after{transition:none}}
.pf-chart .pf-lbl{unicode-bidi:plaintext}
/* v8.4 deslop: quieter text, one type scale, touch targets, fewer tags and effects */
.ua-toc{display:none!important}
.ua-pane .ua-sub{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ua-pane .ua-sub.is-open,.ua-pane .ua-sub:focus-visible{-webkit-line-clamp:unset;display:block}
.ua-t{background:transparent!important;border:1px solid var(--border);color:var(--ink-muted)!important;font-size:12px}
.ua-t--v{border-color:color-mix(in srgb,var(--positive) 45%,var(--border));color:var(--positive-text)!important}
.pf-table .nd-pill,.ua-pane .nd-table .nd-pill{background:transparent;padding-inline:0}
.ua-band{background:#1C2745!important}
[data-theme="pro-dark"] .ua-band{background:#0F1526!important}
[data-skin="lemon"][data-theme="pro"] .ua-band{background:#FFFFFF!important}
[data-skin="lemon"][data-theme="pro-dark"] .ua-band{background:#2A2F38!important}
.ua-kpis .nd-card,.nd-card{-webkit-backdrop-filter:none;backdrop-filter:none}
@media (max-width:640px){
  .nd-btn,.nd-seg button,.pfm__s,.gf-chip,.pf-opn__b,.gh-lv button,.ua-side button,.ua-tabs button,.pfm__m button,select,.ua-presentbtn,.ua-theme,.ua-csvbtn,.gf>summary{min-block-size:44px}
  .nd-btn--sm{min-block-size:44px;block-size:auto}
  .pfm__s{block-size:44px}
}
</style>

  }
  function nxStage(i) { return (D.funnel[i + 1] || {}).stage || D.funnel[i].next || '—'; }
  function funnelTitle() { const n = neck(); if (!n) return 'משפך: אין עדיין שיעורי מעבר'; const i = D.funnel.indexOf(n); return `הפער הגדול מה-Benchmark: מ-${n.stage} ל-${nxStage(i)} (${pct(v(n.toNext))} מול ${pct(v(n.bench))})`; }
  function creativeTitle() {
    const gaps = Object.values(D.creative.cells).filter(c => c === 'gap').length;
    return gaps ? `${gaps} צירופי Angle × Format פתוחים לטסט` : 'מטריצת קריאייטיב';
  }
  function perfSection(pf) {
    const tot = pf.rows.reduce((a, r) => ({ spend: a.spend + (r.spend || 0), binds: a.binds + (r.binds || 0) }), { spend: 0, binds: 0 });
    return `<section class="nd-card"><h2 class="ua-sec-title">${esc(pf.title || 'ביצועים בפועל')}</h2><p class="ua-sub">${esc(pf.period || '')}</p>
      <div class="ua-scroll"><table class="nd-table"><thead><tr><th>ערוץ</th><th class="is-num">Spend</th><th class="is-num">Binds</th><th class="is-num">CAC</th></tr></thead>
      <tbody>${pf.rows.map(r => `<tr><td><bdi>${esc(r.channel)}</bdi></td><td class="is-num">${usd(r.spend)}</td><td class="is-num">${nf0.format(r.binds || 0)}</td><td class="is-num">${r.binds ? usd(r.spend / r.binds) : '—'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>סה״כ</td><td class="is-num">${usd(tot.spend)}</td><td class="is-num">${nf0.format(tot.binds)}</td><td class="is-num">${tot.binds ? usd(tot.spend / tot.binds) : '—'}</td></tr></tfoot></table></div></section>`;
  }

  function calc() {
    const g = id => parseFloat(String(document.getElementById(id).value).replace(/[^\d.]/g, ''));
    const cac = g('c-cac'), prem = g('c-prem'), gm = g('c-gm') / 100, ret = g('c-ret') / 100;
    const gp = ok(prem) && ok(gm) ? prem * gm / 12 : NaN;
    const pb = ok(cac) && gp > 0 ? cac / gp : NaN;
    let ltv = NaN; if (gp > 0 && ok(ret) && ret > 0) { const rm = Math.pow(ret, 1 / 12); ltv = 0; for (let m = 0; m < 24; m++) ltv += gp * Math.pow(rm, m); }
    const r = ok(ltv) && cac > 0 ? ltv / cac : NaN;
    document.getElementById('calcOut').innerHTML =
      `<div>Payback<b>${ok(pb) ? mo(pb) + ' ח׳' : '—'}</b>${gp > 0 ? '' : 'צריך Premium ו-GM'}</div>
       <div>LTV (24M GP)<b>${usd(ltv)}</b>GP חודשי ${usd(gp)}</div>
       <div>LTV:CAC<b>${ok(r) ? nf1.format(r) + 'x' : '—'}</b>${ok(r) ? (r >= 3 ? 'בריא' : r >= 1.5 ? 'גבולי' : 'לא כלכלי לבד') : ''}</div>`;
  }

  function wire() {
    perfWire();
    const side = document.querySelector('.ua-side'); side && side.addEventListener('keydown', ev => { if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return; ev.preventDefault(); ev.stopPropagation(); const i = TABS.findIndex(t => t.id === S.tab), n = i + (ev.key === 'ArrowDown' ? 1 : -1); if (n < 0 || n >= TABS.length) return; S.tab = TABS[n].id; saveState(); render(); const t = document.querySelector(`[data-tab="${S.tab}"]`); t && t.focus({ preventScroll: true }); });
    const toc = document.getElementById('uaToc');
    if (toc) { const hs = [...document.querySelectorAll('#app .ua-pane:not([hidden]) h2[id]')].filter(h => h.offsetParent !== null && h.textContent.trim());
      if (hs.length >= 3) { toc.innerHTML = '<span>בעמוד הזה:</span>' + hs.map(h => `<a href="#${h.id}" data-toc="${h.id}">${esc(h.textContent.trim())}</a>`).join(''); toc.hidden = false;
        toc.querySelectorAll('[data-toc]').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); const h = document.getElementById(a.dataset.toc); h && h.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); })); } }
    document.querySelectorAll('[data-dp]').forEach(b => b.addEventListener('click', () => { S.dp = b.dataset.dp; syncProd(S.dp); saveState(); render(); const n = document.querySelector(`[data-dp="${S.dp}"]`); n && n.focus({ preventScroll: true }); }));
    document.querySelectorAll('[data-prod]').forEach(el => el.addEventListener('click', () => {
      S.product = el.dataset.prod; syncProd(S.product); saveState(); const sel = `[data-prod="${S.product}"]`; const wasSeg = !!el.closest('.nd-seg');
      render(); const again = document.querySelector((wasSeg ? '.nd-seg ' : '.ua-linkbtn') + sel) || document.querySelector(sel); again && again.focus({ preventScroll: true });
    }));
    document.querySelectorAll('[data-budget]').forEach(el => el.addEventListener('click', () => { S.budget = +el.dataset.budget; saveState(); render(); const a = document.querySelector(`[data-budget="${S.budget}"]`); a && a.focus({ preventScroll: true }); }));
    document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { S.tab = el.dataset.tab; saveState(); render(); const t = document.querySelector(`[data-tab="${S.tab}"]`); t && t.focus({ preventScroll: true }); }));
    document.getElementById('presentBtn').addEventListener('click', () => { S.present = !S.present; const sc = D.budgetScenarios || []; if (S.present && sc.length) S.budget = sc[sc.length - 1].v; saveState(); render(); document.getElementById('presentBtn').focus(); });
    document.querySelectorAll('[data-market]').forEach(el => el.addEventListener('click', () => { S.market = el.dataset.market; saveState(); render(); }));
    document.querySelectorAll('[data-channel]').forEach(el => el.addEventListener('click', () => { S.channel = +el.dataset.channel; saveState(); render(); }));
    document.getElementById('verBtn').addEventListener('click', () => { S.onlyVer = !S.onlyVer; saveState(); render(); document.getElementById('verBtn').focus(); });
    document.getElementById('sheetBtn').addEventListener('click', () => { S.sheet = !S.sheet; render(); });
    document.getElementById('sheetClose').addEventListener('click', () => { S.sheet = false; render(); document.getElementById('sheetBtn').focus(); });
    document.querySelectorAll('[data-wi]').forEach(el => {
      const key = { 'wi-cac': 'cac', 'wi-lr': 'lr', 'wi-prem': 'prem' }[el.dataset.wi], fmt = key === 'lr' ? x => x + '%' : x => '$' + nf0.format(x);
      el.addEventListener('input', () => {
        document.getElementById(el.id + '-o').textContent = fmt(+el.value);
        const p = prod(), keep = S.wi[p.id]; S.wi[p.id] = Object.assign({}, keep, { [key]: +el.value }); const q = econ(p); S.wi[p.id] = keep;
        document.getElementById('wiRes').innerHTML = `Payback <b class="nd-num">${ok(q.payback) ? mo(q.payback) : '—'}</b> ח׳ · LTV:CAC <b class="nd-num" dir="ltr">${ok(q.ratio) ? nf1.format(q.ratio) + 'x' : '—'}</b>`;
      });
      el.addEventListener('change', () => { const p = prod(); S.wi[p.id] = Object.assign({}, S.wi[p.id], { [key]: +el.value }); render(); const n = document.getElementById(el.id); n && n.focus({ preventScroll: true }); });
    });
    const wr = document.getElementById('wiReset'); wr && wr.addEventListener('click', () => { delete S.wi[prod().id]; render(); });
    const fi = document.getElementById('csvIn'), dz = document.getElementById('dropZone');
    const load = f => { if (!f) return; const r = new FileReader(); r.onload = () => { try { PF = perfFromCSV(String(r.result), f.name); S.pf.camps = []; S.pf.prod = 'all'; render(); } catch (err) { document.getElementById('csvErr').textContent = err.message; } }; r.readAsText(f); };
    fi && fi.addEventListener('change', () => load(fi.files[0]));
    dz && ['dragover', 'dragenter'].forEach(t => dz.addEventListener(t, ev => { ev.preventDefault(); dz.classList.add('is-over'); }));
    dz && ['dragleave', 'drop'].forEach(t => dz.addEventListener(t, ev => { ev.preventDefault(); dz.classList.remove('is-over'); if (t === 'drop') load(ev.dataTransfer.files[0]); }));
    const b = document.getElementById('budget') || document.createElement('input');
    const commit = () => { const n = parseFloat(b.value.replace(/[^\d.]/g, '')); if (ok(n) && n > 0) { S.budget = n; render(); document.getElementById('budget').focus(); } else b.value = nf0.format(S.budget); };
    b.addEventListener('change', commit);
    b.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
    document.getElementById('skinBtn').addEventListener('click', () => { const r = document.documentElement; r.dataset.skin = { lemon: 'pro', pro: 'mix', mix: 'lemon' }[r.dataset.skin] || 'pro'; try { localStorage.setItem('ua-skin', r.dataset.skin); } catch (e) {} render(); document.getElementById('skinBtn').focus(); });
    document.getElementById('themeBtn').addEventListener('click', () => {
      const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'pro-dark' ? 'pro' : 'pro-dark';
      try { localStorage.setItem('ua-theme', r.dataset.theme); } catch (e) {}
      render(); document.getElementById('themeBtn').focus();
    });
  }

  const normTheme = () => { const r = document.documentElement, t = r.dataset.theme; if (t === 'dark') r.dataset.theme = 'pro-dark'; else if (t === 'light' || !t) r.dataset.theme = 'pro'; };
  try { new MutationObserver(() => { const t = document.documentElement.dataset.theme; if (t === 'dark' || t === 'light') { normTheme(); render(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  if (!window.__subTog) { window.__subTog = 1; document.addEventListener('click', ev => { const p = ev.target.closest && ev.target.closest('.ua-pane .ua-sub'); if (p) p.classList.toggle('is-open'); }); }
  try { const sk = localStorage.getItem('ua-skin'); if (sk === 'pro' || sk === 'lemon' || sk === 'mix') document.documentElement.dataset.skin = sk; } catch (e) {}
  let stored = null; try { stored = localStorage.getItem('ua-theme'); } catch (e) {}
  if (stored === 'pro' || stored === 'pro-dark') document.documentElement.dataset.theme = stored;
  else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'pro-dark';
  document.title = 'UA Plan · ' + D.company;
  try { const sp = localStorage.getItem('ua-perf-' + D.company); if (sp && !D.performance) D.performance = JSON.parse(sp); } catch (e) {}
  document.addEventListener('keydown', ev => {
    if (S.pf.drawer) { if (ev.key === 'Escape') closeDrawer(); return; }
    if (ev.key === 'Escape') hideTip();
    if (ev.altKey || ev.ctrlKey || ev.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || '')) || ev.target.isContentEditable) return;
    if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight' && ev.key !== 'Escape') return;
    if (ev.key === 'Escape') { if (S.sheet) { S.sheet = false; render(); } return; }
    const i = TABS.findIndex(t => t.id === S.tab), n = ev.key === 'ArrowLeft' ? i + 1 : i - 1;
    if (n < 0 || n >= TABS.length) return;
    ev.preventDefault(); S.tab = TABS[n].id; saveState(); render(); const t = document.querySelector(`[data-tab="${S.tab}"]`); t && t.focus({ preventScroll: true });
  });
  render();
})();
</script>
</body>
</html>
