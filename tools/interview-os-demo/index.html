.app{position:relative;z-index:1}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.75rem,5.6vw,2.25rem);line-height:1.15;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.3;letter-spacing:-.005em}
h3{font-size:1.04rem;line-height:1.4;font-weight:600}
h4{font-size:.9rem;font-weight:600;color:var(--accent-ink)}
p{margin:0;max-width:68ch}
a{color:var(--accent-ink);text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select,textarea{font:inherit;color:inherit}
option{background:var(--surface);color:var(--ink)}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.9375rem} .tiny{font-size:.875rem}
.label{font-size:.875rem;font-weight:600;color:var(--muted)}
.lead{font-size:1.0625rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-weight:500;direction:ltr;unicode-bidi:isolate}
.cue{font-size:.85rem;font-weight:600;color:var(--muted)}
.script{font-family:var(--f-script)}
.slug{font-size:.84rem;font-weight:600;color:var(--muted)}
.who small{display:block;font-size:.86rem}
/* spike tape: the marks stage managers put on the floor */
.tape{display:inline-block;width:8px;height:8px;background:currentColor;border-radius:50%;flex:none}
.tape.g{background:var(--faint)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 1px 0 var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1;white-space:nowrap;font-weight:800}
.logo{width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--accent)}
.jobsel{display:flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:0 10px;box-shadow:inset 0 0 0 1px var(--line);min-height:44px;min-width:0;flex:0 1 360px;position:relative;background:var(--sunk)}
.jobsel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font-weight:600;font-size:.95rem;padding:8px 0;min-width:0;width:100%;text-overflow:ellipsis;cursor:pointer}
.jobsel select:focus{outline:none}
.jobsel:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.jobsel svg{flex:none;color:var(--muted);pointer-events:none}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:.95rem;cursor:pointer;transition:transform 100ms ease-out,background 150ms,box-shadow 150ms,color 150ms;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.blue{background:var(--accent);color:var(--on-accent);box-shadow:none}
.btn.dark:hover,.btn.blue:hover{background:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem}
.btn.icon{width:44px;padding:0}
.btn.big{min-height:56px;padding:0 32px;font-size:1.08rem;font-weight:700;border-radius:16px}

/* nav: underline tabs on desktop, 5-tab bar on phone */
.nav{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:8px 12px 12px;font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative;transition:color 150ms}
.nav button::after{content:"";position:absolute;inset:auto 12px 2px;height:3px;background:var(--accent);transform:scaleX(0);transition:transform 260ms var(--ease-out)}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{transform:scaleX(1)}
.nav svg{display:none}
.navB{display:none}
@media (max-width:720px){
  .top .nav{display:none}
  .navB{display:grid;position:fixed;inset:auto 0 0 0;z-index:25;max-width:none;background:var(--chrome);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 -1px 0 var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
  .navB button{flex-direction:column;gap:3px;font-size:.74rem;padding:6px 0;min-height:50px;justify-content:center}
  .navB button::after{inset:2px 30% auto;height:3px}
  .navB button[aria-current="page"]{color:var(--accent-ink)}
  .navB svg{display:block;stroke:currentColor}
  main{padding-bottom:120px!important}
  .hide-sm{display:none!important}
  .jobsel{flex:1 1 auto}
  .brand{font-size:1.05rem}
}
@media (prefers-reduced-transparency: reduce){.top,.navB{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast: more){:root{--line:var(--muted)}}

main{max-width:1080px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col,.view{max-width:760px;margin:0 auto;display:grid;gap:22px}
.head{display:grid;gap:10px;padding-block:4px 2px}

.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:grid;gap:12px;min-width:0;align-content:start;box-shadow:var(--card-sh)}
.card.flat{padding:16px}
.list{display:grid}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-good,.p-acc{background:var(--accent-soft);color:var(--accent-ink)}
.p-solid{background:var(--accent);color:var(--on-accent)}
.p-mid,.p-n{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-gap{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* home: the call sheet */
.coach{display:grid;gap:22px;padding-block:6px 4px;position:relative}
.marquee{display:grid;gap:6px}
.count{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.count b{font-weight:800;font-size:clamp(3.4rem,14vw,4.6rem);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.count span{font-weight:700;font-size:clamp(1.4rem,5vw,1.8rem);line-height:1.1}
.count .btn{align-self:center}
.when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-weight:500}
.when b{color:var(--ink)}
.when .btn{min-height:32px;padding:0 8px}
.scene{display:grid;gap:14px;padding:22px;border-radius:var(--r-lg);background:var(--accent);color:var(--on-accent);box-shadow:none;position:relative;overflow:hidden}
.scene .slug,.scene .muted,.scene .nextMeta .dur{color:var(--on-accent);opacity:.85}
.scene .btn.dark{background:var(--on-accent);color:var(--accent-ink)}
.scene .btn.dark:hover{background:var(--on-accent);opacity:.92}
.scene::before{content:none}
.scene>*{position:relative}
.scene .cueRow{display:flex;gap:10px;align-items:center}
.nextT{font-weight:700;font-size:clamp(1.5rem,5.4vw,2rem);line-height:1.2;max-width:24ch}
.nextT small{display:none}
.nextMeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nextMeta .dur{color:var(--muted);font-weight:500}
.later{display:grid}
.later button{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:start;cursor:pointer;width:100%;min-height:52px;color:var(--ink)}
.later button:first-child{border-top:0}
.later .t{font-weight:500;min-width:0}
.later button:hover .t{color:var(--accent-ink)}
.later .step{font-family:var(--f-mono);font-weight:600;font-size:.8rem;color:var(--faint);letter-spacing:.06em;direction:ltr}
.prog{display:grid;gap:14px}
.prow{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 2.6rem;gap:12px;align-items:center}.prow .v{text-align:left}@media (max-width:420px){.prow{grid-template-columns:8rem minmax(0,1fr) 2.4rem;gap:10px}}
.prow .v{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:3.6em;text-align:left;direction:ltr}
.pctBig{font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.sectionHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.tick{width:24px;height:24px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
.tick.on{background:var(--accent);box-shadow:none}
.tick svg{stroke:var(--on-accent)}
.planItem{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:start;cursor:pointer;min-height:48px;color:var(--ink)}
.planItem:first-child{border-top:0}
.planItem .t{flex:1;font-weight:500}
.planItem.done .t{color:var(--faint);text-decoration:line-through}
.mod{background:var(--surface);border-radius:var(--r-md);padding:16px;display:grid;gap:10px;text-align:start;border:0;cursor:pointer;transition:transform 100ms ease-out,box-shadow 150ms;align-content:start;width:100%;color:var(--ink);box-shadow:var(--card-sh)}
.mod:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.mod:active{transform:scale(.985)}
.mod.next{box-shadow:inset 0 0 0 2px var(--accent)}
.modNo{font-weight:800;font-size:1.5rem;line-height:1;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.mod.next .modNo{color:var(--accent)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .7s var(--ease-out)}

/* fit rows */
.reqs{background:var(--surface);border-radius:var(--r-lg);padding:4px 16px;box-shadow:var(--card-sh)}
.rq{border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.rq summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto 14px;gap:12px;align-items:center;padding:14px 0;min-height:56px}
.rq summary::-webkit-details-marker{display:none}
.rq summary .nm{font-weight:600;min-width:0}
.rq summary .nm span{display:block;font-weight:400;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:translateY(-2px) rotate(45deg);transition:transform .3s var(--ease-out);justify-self:center}
.rq[open] summary::after{transform:translateY(2px) rotate(225deg)}
.rq[open] summary .nm span{white-space:normal}
.lv{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.lv.good{background:var(--accent)} .lv.good svg{stroke:var(--on-accent)}
.lv.mid{box-shadow:inset 0 0 0 2px var(--faint)}
.lv.gap{background:var(--bad-soft)} .lv.gap::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad)}
.rq .body{display:grid;gap:10px;padding:0 34px 16px 0}
.quote{font-size:.86rem;color:var(--faint)}
.say{font-size:1rem;background:var(--accent-soft);border-radius:var(--r-sm);border:0;padding:10px 14px;line-height:1.6;padding:10px 14px}
.seg{display:flex;gap:2px;flex-wrap:wrap;justify-self:start;max-width:100%;box-shadow:inset 0 -1px 0 var(--line)}
.seg button{border:0;padding:8px 12px 10px;min-height:42px;font-weight:600;font-size:.92rem;background:transparent;color:var(--muted);cursor:pointer;transition:color 150ms;position:relative}
.seg button::after{content:"";position:absolute;inset:auto 10px -1px;height:3px;background:var(--accent);transform:scaleX(0);transition:transform 240ms var(--ease-out)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button[aria-pressed="true"]::after{transform:scaleX(1)}
.summaryLine{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;color:var(--muted)}
.summaryLine b{font-weight:800;font-size:1.9rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}

.back{border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:8px 0;justify-self:start;font-size:.95rem;min-height:44px}
.steps{display:flex;gap:6px}.steps span{flex:1;height:3px;background:var(--line);transition:background .3s}.steps span.on{background:var(--accent)}
.lesson ol,.lesson ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.opt{display:block;width:100%;text-align:start;background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-weight:500;cursor:pointer;transition:transform 100ms ease-out,border-color 150ms;min-height:46px;color:var(--ink)}
.opt:hover{border-color:var(--faint)}
.opt:active{transform:scale(.985)}
.opt.right{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.timer{font-family:var(--f-mono);font-weight:600;font-size:1.6rem;font-variant-numeric:tabular-nums;direction:ltr}
textarea,input[type=text],input[type=url],input[type=datetime-local],select.in{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;font-size:1rem;min-height:46px}
textarea:focus,input:focus,select.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{min-height:110px;resize:vertical;line-height:1.55}
::placeholder{color:var(--faint)}
.field{display:grid;gap:6px}
.field label{font-size:.86rem;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.fc{background:var(--surface);border-radius:var(--r-lg);min-height:240px;padding:26px 20px;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center;cursor:pointer;border:0;width:100%;transition:transform 100ms ease-out;color:var(--ink);box-shadow:var(--card-sh)}
.fc:active{transform:scale(.985)}
.fc .term{font-weight:800;font-size:2rem;line-height:1;direction:ltr}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.out div{background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:2px}
.out b{font-family:var(--f-mono);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.out span{font-size:.82rem;color:var(--muted)}
input[type=number]{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-sm);padding:9px 11px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;min-height:46px}
details.d{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--card-sh)}
details.d summary{cursor:pointer;list-style:none;padding:16px;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:54px}
details.d summary::-webkit-details-marker{display:none}
details.d summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:translateY(-2px) rotate(45deg);transition:transform .3s var(--ease-out);flex:none}
details.d[open] summary::after{transform:translateY(2px) rotate(225deg)}
details.d .body{padding:0 16px 16px;display:grid;gap:10px}
.star{display:grid;grid-template-columns:auto 1fr;gap:8px 12px}
.star dt{font-weight:700;color:var(--accent-ink)}
.star dd{margin:0;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.stat{background:none;border-radius:0;padding:2px 0 2px 14px;display:grid;gap:4px;box-shadow:none;border-inline-end:1px solid var(--line)}.stat:last-child{border-inline-end:0}
.stat b{font-weight:800;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:.86rem;color:var(--muted)}
.kvrow{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.kvrow:first-child{border-top:0;padding-top:0}
.doc{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-child{border-top:0}
.doc .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--accent-soft);display:grid;place-items:center;flex:none}
.doc .ic svg{stroke:var(--accent-ink)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.notice{border-radius:var(--r-md);padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:4px}
.notice b{color:var(--ink)}
.info{border-radius:var(--r-md);padding:14px 16px;background:var(--accent-soft);display:grid;gap:6px}

/* ads */
.gad{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:8px;min-width:0;box-shadow:var(--card-sh)}
.gad .ad-body{direction:ltr;text-align:left;unicode-bidi:isolate;display:grid;gap:3px}
.gad .sp{font-size:.74rem;font-weight:700;color:var(--ink)}
.gad .hl{color:var(--accent-ink);font-size:1.02rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.gad .tx{color:var(--muted);font-size:.92rem;line-height:1.5}
.gad.off{background:transparent}
.gad.off .hl{color:var(--muted)}
.dotOn{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none;box-shadow:0 0 8px var(--accent)}
.dotOff{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.angle{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.angle:first-child{border-top:0;padding-top:0}
.angle .atop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.angle .ex{font-size:.86rem;color:var(--faint);direction:ltr;text-align:left;unicode-bidi:isolate}
.cmp{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0;padding-top:0}
.cmp .row{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:2px 12px;font-size:.92rem}
.cmp .row span:nth-child(odd){color:var(--muted)}
.cmp.me h3{color:var(--accent-ink)}
.test{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.test:first-child{border-top:0;padding-top:0}
.abf{display:grid;gap:12px}
.sayBox{border-radius:var(--r-lg);padding:20px;display:grid;gap:4px;background:var(--surface);box-shadow:var(--card-sh)}
.sayBox p{font-family:var(--f-script);font-size:1.12rem;line-height:1.6;padding:8px 0;border-top:1px solid var(--line)}
.sayBox p:first-of-type{border-top:0}

/* sheets: rise from the bottom, leave the same way, drag down to close */
.scrim{position:fixed;inset:0;z-index:39;background:var(--scrim);opacity:0;transition:opacity 280ms ease}
.scrim.in{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;z-index:40;margin:0 auto;max-width:760px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;box-shadow:var(--shadow-sheet);display:grid;grid-template-rows:auto minmax(0,1fr);transform:translateY(100%);transition:transform 420ms var(--ease-out);will-change:transform}
.sheet.in{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{display:grid;place-items:center;padding:10px 0 4px;cursor:grab;touch-action:none}
.grab span{width:40px;height:5px;border-radius:5px;background:var(--line)}
